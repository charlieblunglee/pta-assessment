<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your HIMAP verification code</title></head>
<body style="margin:0;padding:24px 12px;background-color:#f2f6f8;font-family:Arial,Helvetica,sans-serif;color:#12313e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #dde7eb;">
      <tr><td align="center" style="padding:28px 24px 20px;">
        <img src="{{ .SiteURL }}/himap-email-logo.png" width="240" alt="HIMAP — Healthcare Information Management Association of the Philippines" style="display:block;width:240px;max-width:100%;height:auto;border:0;">
      </td></tr>
      <tr><td style="padding:8px 28px 24px;">
        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Your HIMAP verification code</h1>
        <p style="margin:0 0 20px;font-size:16px;line-height:1.6;">Enter the complete code below in HIMAP to begin or resume your assessment.</p>
        <p style="margin:0 0 20px;padding:18px 12px;background-color:#edf7f7;text-align:center;font-size:32px;font-weight:bold;letter-spacing:6px;color:#003e54;">{{ .Token }}</p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#526875;">This code expires and can only be used once. Please keep it private. If you did not request this email, you can ignore it.</p>
      </td></tr>
      <tr><td align="center" style="padding:20px 28px 26px;border-top:1px solid #e4ecef;">
        <img src="{{ .SiteURL }}/powered-by-concentrix.png" width="160" alt="Powered by Concentrix" style="display:block;width:160px;max-width:100%;height:auto;border:0;">
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
